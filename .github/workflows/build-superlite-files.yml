name: Build SuperLite Files (musl)

on:
  workflow_dispatch:
  push:
    paths:
      - 'vendor/superlite-files/**'
      - 'build-superlite-files.sh'
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build SuperLite Files in Docker
        run: |
          mkdir -p prebuilt/superlite-files
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -v "${{ github.workspace }}/prebuilt/superlite-files:/output" \
            -w /build \
            alpine:3.23 \
            sh -c '
              apk add --no-cache make build-base
              sh /build/build-superlite-files.sh
              if [ -d /tmp/superlite-files-musl ]; then
                cp -a /tmp/superlite-files-musl/* /output/
                echo "Copied to /output/"
              else
                echo "ERROR: /tmp/superlite-files-musl not found"
                exit 1
              fi
            '

      - name: Verify binary
        run: |
          file prebuilt/superlite-files/usr/bin/superlite-files || echo "WARNING: binary not found"
          ls -la prebuilt/superlite-files/ 2>/dev/null || echo "WARNING: prebuilt/superlite-files/ empty"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: superlite-files-musl
          path: prebuilt/superlite-files/
          retention-days: 30

      - name: Commit prebuilt to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prebuilt/superlite-files/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update prebuilt SuperLite Files binary [skip ci]

          Built from vendor/superlite-files at $(git -C vendor/superlite-files rev-parse --short HEAD 2>/dev/null || echo 'unknown')
          Workflow run: ${{ github.run_id }}"
            git push
          fi
