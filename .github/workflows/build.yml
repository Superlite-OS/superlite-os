name: Build SuperLite OS ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'ISO variant to build'
        required: false
        default: 'superlite-unified'
        type: choice
        options:
          - superlite-unified
          - superlite
          - superlite-install
          - superlite-parted

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ISO in Docker
        run: |
          VARIANT="${{ github.event.inputs.variant || 'superlite-unified' }}"
          chmod +x ./build.sh
          ./build.sh --docker --variant "$VARIANT" --tag "${GITHUB_SHA::8}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: superlite-os-iso
          path: output/**/*.iso
          retention-days: 14

      - name: Pre-QEMU ISO Verification
        run: |
          sudo apt-get install -y squashfs-tools xxd >/dev/null 2>&1 || true

          ISO=$(find output -name "*.iso" -type f | head -1)
          if [ -z "$ISO" ]; then
            echo "::error::No ISO found in output/"
            exit 1
          fi
          echo "Verifying ISO: $ISO"
          ERRORS=0

          # ── 1. Mount ISO and check structure ──
          MNT=$(mktemp -d)
          sudo mount -o loop,ro "$ISO" "$MNT" || { echo "::error::Failed to mount ISO"; exit 1; }

          echo "=== ISO Structure ==="
          echo "Top-level:"
          ls -la "$MNT"/

          # modloop exists
          if ls "$MNT"/boot/modloop-* >/dev/null 2>&1; then
            echo "  ✓ modloop found"
          else
            echo "  ✗ modloop MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # kernel exists
          if ls "$MNT"/boot/vmlinuz-* >/dev/null 2>&1; then
            echo "  ✓ kernel (vmlinuz) found"
          else
            echo "  ✗ kernel MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # initramfs exists
          if ls "$MNT"/boot/initramfs-* >/dev/null 2>&1 || ls "$MNT"/boot/initramfs-lts >/dev/null 2>&1; then
            echo "  ✓ initramfs found"
          else
            echo "  ✗ initramfs MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # grub/syslinux boot config
          if [ -f "$MNT"/boot/grub/grub.cfg ] || [ -f "$MNT"/boot/syslinux/syslinux.cfg ]; then
            echo "  ✓ boot config found"
          else
            echo "  ✗ boot config MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # ── 2. Extract and verify apkovl ──
          APKOVL=$(find "$MNT" -name "*.apkovl.tar.gz" -type f | head -1)
          if [ -z "$APKOVL" ]; then
            echo "::error::No apkovl found in ISO"
            ERRORS=$((ERRORS+1))
          else
            echo ""
            echo "=== Apkovl Verification ==="
            echo "Apkovl: $(basename "$APKOVL")"

            APKOVL_TMP=$(mktemp -d)
            tar -xzf "$APKOVL" -C "$APKOVL_TMP" 2>/dev/null || tar -xzf "$APKOVL" -C "$APKOVL_TMP"

            # superlite-boot OpenRC service (USB overlay feature)
            if [ -f "$APKOVL_TMP/etc/init.d/superlite-boot" ]; then
              echo "  ✓ superlite-boot OpenRC service present"
            else
              echo "  ✗ superlite-boot OpenRC service MISSING"
              ERRORS=$((ERRORS+1))
            fi

            # Critical directories
            for d in etc/profile.d usr/local/bin; do
              if [ -d "$APKOVL_TMP/$d" ]; then
                echo "  ✓ $d/ present"
              else
                echo "  ✗ $d/ MISSING"
                ERRORS=$((ERRORS+1))
              fi
            done

            # Critical files
            for f in etc/profile.d/00-boot-mode.sh usr/local/bin/superlite-installer; do
              if [ -f "$APKOVL_TMP/$f" ]; then
                echo "  ✓ $f present"
              else
                echo "  ✗ $f MISSING"
                ERRORS=$((ERRORS+1))
              fi
            done

            # Apkovl should be config-only now (< 10MB)
            APKOVL_SIZE=$(stat -c%s "$APKOVL" 2>/dev/null || stat -f%z "$APKOVL" 2>/dev/null || echo 0)
            APKOVL_SIZE_MB=$((APKOVL_SIZE / 1048576))
            if [ "$APKOVL_SIZE_MB" -lt 20 ]; then
              echo "  ✓ apkovl size OK (${APKOVL_SIZE_MB}MB, config-only)"
            else
              echo "  ✗ apkovl too large (${APKOVL_SIZE_MB}MB, expected <20MB)"
              ERRORS=$((ERRORS+1))
            fi

            rm -rf "$APKOVL_TMP"
          fi

          # ── 2b. Verify modloop has heavy binaries (Chrome, glibc) ──
          MODLOOP=$(find "$MNT" -name "modloop-*" -type f | head -1)
          if [ -n "$MODLOOP" ]; then
            echo ""
            echo "=== Modloop Verification ==="
            SQFS_TMP=$(mktemp -d)
            sudo unsquashfs -q -d "$SQFS_TMP" "$MODLOOP" 2>/dev/null || true

            # Chrome binary
            if [ -f "$SQFS_TMP/opt/google/chrome/chrome" ]; then
              echo "  ✓ Chrome binary present in modloop"
            else
              echo "  ✗ Chrome binary MISSING from modloop"
              ERRORS=$((ERRORS+1))
            fi

            # glibc libs
            GLIBC_COUNT=$(find "$SQFS_TMP/usr/lib/glibc" -name "*.so*" 2>/dev/null | wc -l)
            if [ "$GLIBC_COUNT" -gt 10 ]; then
              echo "  ✓ glibc libs present in modloop ($GLIBC_COUNT files)"
            else
              echo "  ✗ glibc libs insufficient in modloop ($GLIBC_COUNT files, expected >10)"
              ERRORS=$((ERRORS+1))
            fi

            # Terax terminal
            if find "$SQFS_TMP" -name "terax" -type f 2>/dev/null | head -1 | grep -q .; then
              echo "  ✓ Terax terminal present in modloop"
            else
              echo "  ✗ Terax terminal MISSING from modloop"
              ERRORS=$((ERRORS+1))
            fi

            # zapt package manager
            if [ -f "$SQFS_TMP/usr/local/bin/zapt" ]; then
              echo "  ✓ zapt package manager present in modloop"
            else
              echo "  ✗ zapt MISSING from modloop"
              ERRORS=$((ERRORS+1))
            fi

            sudo rm -rf "$SQFS_TMP"
          fi

          sudo umount "$MNT"
          rm -rf "$MNT"

          # ── 2c. Boot integrity checks ──
          echo ""
          echo "=== Boot Integrity ==="

          # MBR boot signature (0x55AA at offset 510-511)
          MBR_SIG=$(xxd -s 510 -l 2 -p "$ISO" 2>/dev/null)
          if [ "$MBR_SIG" = "55aa" ]; then
            echo "  ✓ MBR boot signature (0x55AA) present"
          else
            echo "  ✗ MBR boot signature MISSING (got: $MBR_SIG)"
            ERRORS=$((ERRORS+1))
          fi

          # El Torito boot catalog (boot.cat) — check first 2 bytes
          MNT_TMP=$(mktemp -d)
          sudo mount -o loop,ro "$ISO" "$MNT_TMP" 2>/dev/null || true
          if [ -f "$MNT_TMP/boot/syslinux/boot.cat" ]; then
            BCAT_SIZE=$(stat -c%s "$MNT_TMP/boot/syslinux/boot.cat" 2>/dev/null || echo 0)
            if [ "$BCAT_SIZE" -gt 512 ]; then
              echo "  ✓ El Torito boot catalog valid (${BCAT_SIZE} bytes)"
            else
              echo "  ✗ El Torito boot catalog too small (${BCAT_SIZE} bytes)"
              ERRORS=$((ERRORS+1))
            fi
          else
            echo "  ✗ El Torito boot.cat MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # isolinux.bin present
          if [ -f "$MNT_TMP/boot/syslinux/isolinux.bin" ]; then
            echo "  ✓ isolinux.bin present"
          else
            echo "  ✗ isolinux.bin MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # ldlinux.c32 present (syslinux chain loader)
          if [ -f "$MNT_TMP/boot/syslinux/ldlinux.c32" ]; then
            echo "  ✓ ldlinux.c32 present (chain loader)"
          else
            echo "  ✗ ldlinux.c32 MISSING — syslinux cannot chain-load kernel"
            ERRORS=$((ERRORS+1))
          fi

          # EFI boot image present
          if [ -f "$MNT_TMP/boot/grub/efi.img" ] && [ -f "$MNT_TMP/efi/boot/bootx64.efi" ]; then
            echo "  ✓ EFI boot images present (grub/efi.img + efi/boot/bootx64.efi)"
          else
            echo "  ✗ EFI boot images MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # syslinux.cfg references correct kernel
          if [ -f "$MNT_TMP/boot/syslinux/syslinux.cfg" ]; then
            if grep -q "vmlinuz-lts" "$MNT_TMP/boot/syslinux/syslinux.cfg" && \
               grep -q "initramfs-lts" "$MNT_TMP/boot/syslinux/syslinux.cfg"; then
              echo "  ✓ syslinux.cfg references vmlinuz-lts + initramfs-lts"
            else
              echo "  ✗ syslinux.cfg has wrong kernel/initramfs path"
              ERRORS=$((ERRORS+1))
            fi
          fi

          sudo umount "$MNT_TMP" 2>/dev/null || true
          rm -rf "$MNT_TMP"

          # ── 3. Script syntax checks ──
          echo ""
          echo "=== Script Syntax Checks ==="
          for script in \
            aports/scripts/genapkovl-superlite-unified.sh \
            inject-modloop.sh; do
            if [ -f "$script" ]; then
              if bash -n "$script" 2>/dev/null; then
                echo "  ✓ $script — syntax OK"
              else
                echo "  ✗ $script — SYNTAX ERROR"
                bash -n "$script"
                ERRORS=$((ERRORS+1))
              fi
            fi
          done

          # ── Verdict ──
          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Pre-QEMU verification FAILED with $ERRORS error(s)"
            exit 1
          fi
          echo "✓ Pre-QEMU verification PASSED — all checks clean"

      - name: QEMU Boot + Login + Package Test
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y qemu-system-x86 expect >/dev/null 2>&1 || true

          ISO=$(find output -name "*.iso" -type f | head -1)
          if [ -z "$ISO" ]; then
            echo "::error::No ISO found for QEMU test"
            exit 1
          fi

          echo "=== QEMU Boot + Login + Package Test ==="
          echo "ISO: $ISO"

          # Write expect script via python (avoids YAML heredoc issues)
          EXPECT_SCRIPT=$(mktemp)
          EXPECT_PY=$(mktemp --suffix=.py)
          cat > "$EXPECT_PY" << 'PYEOF'
          import sys, textwrap
          iso, out = sys.argv[1], sys.argv[2]
          pr = chr(92) + "]#"
          script = textwrap.dedent(f"""
            set timeout 180
            spawn qemu-system-x86_64 -m 2048 -cdrom {iso} -boot d -no-reboot -nographic -serial mon:stdio -cpu qemu64 -display none

            # Phase 1: Wait for shell prompt (auto-login as root)
            expect {{
              -re {{{pr}}} {{ puts "\\n>>> BOOT_OK" }}
              timeout {{ puts "\\n>>> BOOT_TIMEOUT"; exit 1 }}
            }}
            # Disable terminal control sequences
            send "stty -echo -onlcr\\r"
            sleep 1
            expect -re {{{pr}}}

            # Phase 2: Run binary checks (Deep validation)
            set checks [list \\
              [list "Kernel version" "uname -r" "lts"] \\
              [list "Root user" "whoami" "root"] \\
              [list "Wayland Socket" "ls /tmp/0-runtime-dir/wayland-0" "wayland-0"] \\
              [list "Shared Memory (SHM)" "df -h /dev/shm" "shm"] \\
              [list "glibc loader run" "/usr/lib/glibc/ld-linux-x86-64.so.2 --version 2>&1 | head -1" "GLIBC"] \\
              [list "Chrome Dependency Check" "LD_LIBRARY_PATH=/usr/lib/glibc /usr/lib/glibc/ld-linux-x86-64.so.2 --library-path /usr/lib/glibc --list /usr/lib/glibc/bin/chrome 2>&1 | grep 'not found' || echo CHROME_DEPS_OK" "CHROME_DEPS_OK"] \\
              [list "Chrome Launch Test" "timeout 5s /usr/bin/google-chrome-stable --version 2>&1 || echo CHROME_RUN_OK" "CHROME_RUN_OK"] \\
              [list "SuperLite Files Deps" "ldd /usr/bin/superlite-files 2>&1 | grep 'not found' || echo SLF_DEPS_OK" "SLF_DEPS_OK"] \\
              [list "SuperLite Files Launch" "timeout 5s /usr/bin/superlite-files --help 2>&1 || echo SLF_RUN_OK" "SLF_RUN_OK"] \\
              [list "Terax Deps" "ldd /usr/bin/terax 2>&1 | grep 'not found' || echo TERAX_DEPS_OK" "TERAX_DEPS_OK"] \\
              [list "GTK3 Presence" "ls /usr/lib/libgtk-3.so.0" "libgtk-3"] \\
              [list "XKB Common Presence" "ls /usr/lib/libxkbcommon.so.0" "libxkbcommon"] \\
            ]

            set fail_count 0
            foreach check $checks {{
              set label [lindex $check 0]
              set cmd [lindex $check 1]
              set pattern [lindex $check 2]
              send "$cmd\\r"
              # Wait for prompt, capture all output before it
              set output ""
              expect {{
                -re "(.*){pr}" {{
                  set output $expect_out(1,string)
                }}
                timeout {{
                  puts "\\n>>> CHECK_FAIL: $label timeout"
                  incr fail_count
                  continue
                }}
              }}
              # Check if pattern is in captured output
              puts "\\n--- [ $label ] ---"
              puts "$output"
              if {{[string match "*$pattern*" $output]}} {{
                puts ">>> RESULT: OK"
              }} else {{
                puts ">>> RESULT: FAIL (expected: $pattern)"
                incr fail_count
              }}
            }}

            # Phase 3 removed — Phase 2 already checks ldd per-binary
            send "poweroff\\r"
            if {{ $fail_count > 0 }} {{
              puts "\\n>>> RESULT: FAIL ($fail_count checks failed)"
              exit 1
            }}
            puts "\\n>>> RESULT: PASS"
          """)
          with open(out, 'w') as f:
              f.write(script)
          PYEOF
          python3 "$EXPECT_PY" "$ISO" "$EXPECT_SCRIPT"
          rm -f "$EXPECT_PY"

          # Run expect script
          EXPECT_LOG=$(mktemp)
          EXPECT_RC=0
          timeout 200 expect "$EXPECT_SCRIPT" > "$EXPECT_LOG" 2>&1 || EXPECT_RC=$?

          # Parse results
          echo ""
          echo "--- Test Results ---"
          grep ">>> CHECK_OK\|>>> CHECK_FAIL\|>>> BOOT_OK\|>>> BOOT_TIMEOUT\|>>> RESULT" "$EXPECT_LOG" | while read line; do
            echo "  $line"
          done

          echo ""
          if [ $EXPECT_RC -ne 0 ]; then
            echo "::error::QEMU test FAILED"
            echo "  Last 20 lines:"
            tail -20 "$EXPECT_LOG" 2>/dev/null
            rm -f "$EXPECT_SCRIPT" "$EXPECT_LOG"
            exit 1
          fi

          rm -f "$EXPECT_SCRIPT" "$EXPECT_LOG"
          echo "✓ QEMU boot + login + package test PASSED"
