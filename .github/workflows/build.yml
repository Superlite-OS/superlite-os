name: Build SuperLite OS ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'ISO variant to build'
        required: false
        default: 'superlite-unified'
        type: choice
        options:
          - superlite-unified
          - superlite
          - superlite-install
          - superlite-parted

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build ISO in Docker
        run: |
          VARIANT="${{ github.event.inputs.variant || 'superlite-unified' }}"
          chmod +x ./build.sh
          ./build.sh --docker --variant "$VARIANT" --tag "${GITHUB_SHA::8}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: superlite-os-iso
          path: output/**/*.iso
          retention-days: 14

      - name: Pre-QEMU ISO Verification
        run: |
          ISO=$(find output -name "*.iso" -type f | head -1)
          if [ -z "$ISO" ]; then
            echo "::error::No ISO found in output/"
            exit 1
          fi
          echo "Verifying ISO: $ISO"
          ERRORS=0

          # ── 1. Mount ISO and check structure ──
          MNT=$(mktemp -d)
          sudo mount -o loop,ro "$ISO" "$MNT" || { echo "::error::Failed to mount ISO"; exit 1; }

          echo "=== ISO Structure ==="
          echo "Top-level:"
          ls -la "$MNT"/

          # modloop exists
          if ls "$MNT"/boot/modloop-* >/dev/null 2>&1; then
            echo "  ✓ modloop found"
          else
            echo "  ✗ modloop MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # kernel exists
          if ls "$MNT"/boot/vmlinuz-* >/dev/null 2>&1; then
            echo "  ✓ kernel (vmlinuz) found"
          else
            echo "  ✗ kernel MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # initramfs exists
          if ls "$MNT"/boot/initramfs-* >/dev/null 2>&1 || ls "$MNT"/boot/initramfs-lts >/dev/null 2>&1; then
            echo "  ✓ initramfs found"
          else
            echo "  ✗ initramfs MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # grub/syslinux boot config
          if [ -f "$MNT"/boot/grub/grub.cfg ] || [ -f "$MNT"/boot/syslinux/syslinux.cfg ]; then
            echo "  ✓ boot config found"
          else
            echo "  ✗ boot config MISSING"
            ERRORS=$((ERRORS+1))
          fi

          # ── 2. Extract and verify apkovl ──
          APKOVL=$(find "$MNT" -name "*.apkovl.tar.gz" -type f | head -1)
          if [ -z "$APKOVL" ]; then
            echo "::error::No apkovl found in ISO"
            ERRORS=$((ERRORS+1))
          else
            echo ""
            echo "=== Apkovl Verification ==="
            echo "Apkovl: $(basename "$APKOVL")"

            APKOVL_TMP=$(mktemp -d)
            tar -xzf "$APKOVL" -C "$APKOVL_TMP" 2>/dev/null || tar -xzf "$APKOVL" -C "$APKOVL_TMP"

            # sbin/init exists (USB overlay feature)
            if [ -f "$APKOVL_TMP/sbin/init" ]; then
              echo "  ✓ /sbin/init present (USB overlay enabled)"
              # Verify it has overlayfs logic
              if grep -q "overlay" "$APKOVL_TMP/sbin/init" 2>/dev/null; then
                echo "  ✓ /sbin/init contains overlayfs logic"
              else
                echo "  ✗ /sbin/init missing overlayfs logic"
                ERRORS=$((ERRORS+1))
              fi
            else
              echo "  ✗ /sbin/init MISSING — USB overlay feature broken"
              ERRORS=$((ERRORS+1))
            fi

            # Critical directories
            for d in etc/profile.d usr/local/bin etc/init.d; do
              if [ -d "$APKOVL_TMP/$d" ]; then
                echo "  ✓ $d/ present"
              else
                echo "  ✗ $d/ MISSING"
                ERRORS=$((ERRORS+1))
              fi
            done

            # Critical files
            for f in etc/profile.d/00-boot-mode.sh usr/local/bin/superlite-installer; do
              if [ -f "$APKOVL_TMP/$f" ]; then
                echo "  ✓ $f present"
              else
                echo "  ✗ $f MISSING"
                ERRORS=$((ERRORS+1))
              fi
            done

            # Chrome glibc wrapper (zapt wraps /opt/google/chrome/google-chrome)
            if [ -f "$APKOVL_TMP/opt/google/chrome/google-chrome" ]; then
              if head -1 "$APKOVL_TMP/opt/google/chrome/google-chrome" | grep -q "^#!/"; then
                echo "  ✓ Chrome glibc wrapper present (google-chrome is wrapper)"
              else
                echo "  ✗ Chrome binary NOT wrapped (still raw ELF)"
                ERRORS=$((ERRORS+1))
              fi
            else
              echo "  ✗ Chrome binary MISSING from /opt/google/chrome/"
              ERRORS=$((ERRORS+1))
            fi

            # glibc libs
            GLIBC_COUNT=$(find "$APKOVL_TMP/usr/lib/glibc" -name "*.so*" 2>/dev/null | wc -l)
            if [ "$GLIBC_COUNT" -gt 10 ]; then
              echo "  ✓ glibc libs present ($GLIBC_COUNT files)"
            else
              echo "  ✗ glibc libs insufficient ($GLIBC_COUNT files, expected >10)"
              ERRORS=$((ERRORS+1))
            fi

            rm -rf "$APKOVL_TMP"
          fi

          sudo umount "$MNT"
          rm -rf "$MNT"

          # ── 3. Script syntax checks ──
          echo ""
          echo "=== Script Syntax Checks ==="
          for script in \
            aports/scripts/genapkovl-superlite-unified.sh \
            etc/profile.d/00-boot-mode.sh; do
            if [ -f "$script" ]; then
              if bash -n "$script" 2>/dev/null; then
                echo "  ✓ $script — syntax OK"
              else
                echo "  ✗ $script — SYNTAX ERROR"
                bash -n "$script"
                ERRORS=$((ERRORS+1))
              fi
            fi
          done

          # ── Verdict ──
          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Pre-QEMU verification FAILED with $ERRORS error(s)"
            exit 1
          fi
          echo "✓ Pre-QEMU verification PASSED — all checks clean"
