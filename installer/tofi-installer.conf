# SuperLite OS Installer — Tofi Config
# Full-screen, Catppuccin Mocha

# Window
width = 100%
height = 100%
border-width = 0
outline-width = 0

# Colors — Catppuccin Mocha
background-color = #1e1e2e
text-color = #cdd6f4
prompt-color = #cba6f7
input-color = #cdd6f4
selection-color = #89b4fa
selection-background-color = #313244
selection-match-color = #f38ba8

# Font — smaller to fit more items
font = JetBrains Mono
font-size = 16

# Layout — compact, top-aligned
padding-left = 10%
padding-right = 10%
padding-top = 5%
padding-bottom = 5%
result-spacing = 18
background-padding = 14

# Behavior
num-results = 12
